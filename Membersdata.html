<!DOCTYPE html>
<html>
<head>
    <title>Bot Panel Membership - MoODyMadz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0a2342;
            color: white;
            min-height: 100vh;
            padding: 10px;
        }
        .header {
            background: linear-gradient(135deg, #fdb813 0%, #0056b3 100%);
            text-align: center;
            padding: 15px;
            color: black;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: clamp(24px, 6vw, 36px);
            font-weight: 900;
            font-style: italic;
            font-family: 'Brush Script MT', cursive;
        }
        .search-area {
            text-align: center;
            margin-bottom: 15px;
        }
        .search-btn {
            background: #0056b3;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }

        /* 🔥 NOTIFICATION BAR 🔥 */
        .notification-bar {
            padding: 12px;
            text-align: left;
            font-weight: bold;
            font-size: clamp(14px, 4vw, 16px);
            margin-bottom: 15px;
            border-radius: 8px;
            display: none;
            white-space: pre-line;
            word-wrap: break-word;
        }
        .alert-expired {
            background-color: #ff4444;
            color: white;
            border: 2px solid #cc0000;
            display: block;
        }
        .alert-soon {
            background-color: #ffbb33;
            color: black;
            border: 2px solid #ff8800;
            display: block;
        }
        .alert-none {
            background-color: #00C851;
            color: white;
            border: 2px solid #007E33;
            display: block;
        }

        .container {
            background: #103464;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            overflow-x: auto;
        }
        .title {
            text-align: center;
            font-size: clamp(20px, 5vw, 22px);
            font-weight: bold;
            color: #fdb813;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            min-width: 300px;
        }
        table, th, td {
            border: 2px solid #0056b3;
        }
        th, td {
            padding: 8px 5px;
            text-align: center;
            font-size: clamp(11px, 3vw, 14px);
            word-break: break-word;
        }
        th {
            background: #0a2342;
            color: #fdb813;
        }
        tr:nth-child(even) {
            background: rgba(255,255,255,0.05);
        }
        input {
            width: 100%;
            padding: 8px;
            background: #0a2342;
            border: 1px solid #0056b3;
            color: white;
            border-radius: 5px;
            text-align: center;
            font-size: clamp(12px, 3vw, 13px);
        }
        .action-btn {
            background: #fdb813;
            color: black;
            padding: 6px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            border: none;
            cursor: pointer;
            font-size: clamp(11px, 3vw, 13px);
        }
        .action-btn:hover {
            background: #0056b3;
            color: white;
        }
        .delete-btn {
            background: #ff4444;
            color: white;
        }
        .delete-btn:hover {
            background: #cc0000;
        }
        .history-btn {
            background: #33b5e5;
            color: white;
        }
        .history-btn:hover {
            background: #0099cc;
        }
        .status-active {
            color: #4CAF50;
            font-weight: bold;
        }
        .status-soon {
            color: #ffbb33;
            font-weight: bold;
        }
        .status-expired {
            color: #ff4444;
            font-weight: bold;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.8);
            padding-top: 80px;
        }
        .modal-content {
            background-color: #103464;
            margin: auto;
            padding: 20px;
            border: 3px solid #fdb813;
            width: 85%;
            max-width: 400px;
            border-radius: 15px;
            text-align: center;
            position: relative;
        }
        .modal-content h2 {
            color: #fdb813;
            margin-bottom: 20px;
            font-size: clamp(18px, 5vw, 22px);
        }
        .option-btn {
            display: block;
            width: 90%;
            padding: 12px;
            margin: 8px auto;
            background: #fdb813;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: clamp(14px, 4vw, 16px);
            border: none;
            cursor: pointer;
        }
        .option-btn:hover {
            background: #0056b3;
            color: white;
        }
        .close {
            color: #aaa;
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: #fdb813;
            text-decoration: none;
            cursor: pointer;
        }

        /* 🔐 LOGIN SCREEN STYLE */
        #loginScreen {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: #0a2342;
            padding-top: 15%;
        }
        .login-box {
            width: 90%;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            background: #103464;
            border-radius: 15px;
            border: 3px solid #fdb813;
            text-align: center;
        }
        .login-box h2 {
            color: #fdb813;
            margin-bottom: 25px;
        }
        .login-box input {
            margin-bottom: 15px;
            height: 45px;
            font-size: 16px;
        }

        /* HIDE BUTTONS KAPAG VIEWER LANG */
        .admin-only {
            display: none;
        }
        
        /* ADMIN BUTTON SA TAAS */
        #adminToggleBtn {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #222;
            color: #fdb813;
            border: 1px solid #fdb813;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 5px;
            z-index: 999;
        }

        /* 📜 HISTORY MODAL STYLE */
        #historyModal .modal-content {
            max-height: 80vh;
            overflow-y: auto;
        }
        #historyList {
            text-align: left;
            max-height: 50vh;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .history-item {
            border-bottom: 1px dashed #fdb813;
            padding: 8px 0;
        }
        .history-date {
            color: #fdb813;
            font-weight: bold;
        }
        .history-desc {
            color: #eee;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 🔘 SMALL BUTTON SA TAAS -->
    <button id="adminToggleBtn" onclick="openLogin()">🔐 ADMIN</button>

    <!-- 🔐 LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>🔒 ADMIN LOGIN</h2>
            <input type="password" id="adminPass" placeholder="Enter Password">
            <button class="action-btn" onclick="checkLogin()" style="width:100%; padding:12px; font-size:18px;">LOGIN</button>
            <p id="wrongPass" style="color:red; margin-top:10px; display:none;">❌ Wrong Password!</p>
            <br>
            <button class="option-btn" onclick="closeLogin()" style="background:#555;">BACK TO VIEW</button>
        </div>
    </div>

    <!-- MAIN WEBSITE -->
    <div id="mainContent">
        <div class="header">
            <h1>🤖 BOT PANEL MEMBERSHIP 🤖</h1>
        </div>

        <div class="search-area">
            <button type="button" class="search-btn" onclick="searchMember()">🔍 SEARCH</button>
        </div>

        <div id="notificationBar" class="notification-bar"></div>

        <!-- ADD MEMBER - ADMIN ONLY -->
        <div class="container admin-only" id="addSection">
            <div class="title">📋 ADD NEW MEMBER</div>
            <table id="addTable">
                <tr>
                    <th>IGN</th>
                    <th>OWNER</th>
                    <th>DATE START</th>
                    <th>ACTION</th>
                </tr>
                <tr>
                    <td><input type="text" id="newIGN" placeholder="Enter IGN"></td>
                    <td><input type="text" id="newOwner" placeholder="Enter Name"></td>
                    <td><input type="date" id="newDate"></td>
                    <td><button type='button' class='action-btn' onclick='addMember()'>ADD</button></td>
                </tr>
            </table>
        </div>

        <!-- MEMBER LIST -->
        <div class="container">
            <div class="title">📋 ALL MEMBERS LIST</div>
            <table id="memberTable">
                <thead>
                    <tr>
                        <th>OWNER</th>
                        <th>DATE OF EXPIRATION</th>
                        <th>STATUS</th>
                        <th class="admin-only" id="actionHeader">ACTION</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- LOGOUT BUTTON -->
        <div class="search-area admin-only" style="margin-top:20px;">
            <button type="button" class="search-btn" style="background:#ff4444;" onclick="logout()">🚪 LOGOUT</button>
        </div>
    </div>

    <!-- MODAL OPTIONS -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>MEMBER OPTIONS</h2>
            <p id="modal-ign">IGN: Name</p>
            <br>
            <button type="button" class="option-btn" onclick="extendSelected(1)">📅 1 MONTH</button>
            <button type="button" class="option-btn" onclick="extendSelected(6)">📅 6 MONTHS</button>
            <button type="button" class="option-btn history-btn" onclick="openHistory()">📜 HISTORY</button>
            <hr style="border:1px dashed #fdb813; margin:20px 0;">
            <button type="button" class="option-btn delete-btn" onclick="deleteSelected()">🗑️ DELETE</button>
        </div>
    </div>

    <!-- 📜 HISTORY MODAL -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeHistory()">&times;</span>
            <h2>📜 MEMBER HISTORY</h2>
            <div id="historyList"></div>
            <button type="button" class="option-btn" onclick="closeHistory()">CLOSE</button>
        </div>
    </div>
    
<script>
// 🔐 ADMIN PASSWORD
const PASSWORD = "moodymadz180129";

// 🔧 INIT STORAGE
if (!localStorage.getItem('botMembers')) {
    localStorage.setItem('botMembers', JSON.stringify([]));
}

let membersData = JSON.parse(localStorage.getItem('botMembers')) || [];
let selectedIndex = -1;

// 🔥 FIX OLD DATA
membersData.forEach(m => {
    if (!m.history) m.history = [];
});

// 🔐 SHOW ADMIN UI
function showAdminControls() {
    document.querySelectorAll('.admin-only').forEach(el => {
        el.style.display = 'block';
    });
}

// 🔐 LOGIN
function openLogin() {
    document.getElementById('loginScreen').style.display = 'block';
}
function closeLogin() {
    document.getElementById('loginScreen').style.display = 'none';
}
function checkLogin() {
    let pass = document.getElementById('adminPass').value;

    if (pass == PASSWORD) {
        localStorage.setItem('isAdmin', 'true');

        showAdminControls();
        displayMembers(); // 🔥 refresh table

        closeLogin();
    } else {
        document.getElementById('wrongPass').style.display = 'block';
    }
}
function logout() {
    localStorage.removeItem('isAdmin');
    location.reload();
}

// 📅 FORMAT
function formatDate(d) {
    const m = ["January","February","March","April","May","June",
               "July","August","September","October","November","December"];
    return d.getDate() + " " + m[d.getMonth()] + " " + d.getFullYear();
}

function formatDateTime(d) {
    let h = d.getHours();
    let min = d.getMinutes();
    let ampm = h >= 12 ? "PM" : "AM";

    h = h % 12 || 12;
    min = min < 10 ? "0" + min : min;

    return formatDate(d) + " " + h + ":" + min + " " + ampm;
}

// 🔥 STATUS
function getStatus(exp) {
    let e = new Date(exp);
    let t = new Date();

    e.setHours(0,0,0,0);
    t.setHours(0,0,0,0);

    let diff = Math.ceil((e - t)/(1000*60*60*24));

    if (diff <= 0) return "<span class='status-expired'>❌ EXPIRED</span>";
    if (diff <= 5) return "<span class='status-soon'>⚠️ " + diff + " DAYS LEFT</span>";
    return "<span class='status-active'>✅ ACTIVE</span>";
}

// 🔔 NOTIFICATION BAR
function checkNotifications() {
    let today = new Date();
    today.setHours(0,0,0,0);

    let expired = [];
    let soon = [];

    membersData.forEach(m => {
        let exp = new Date(m.expiry);
        exp.setHours(0,0,0,0);

        let diff = Math.ceil((exp - today)/(1000*60*60*24));

        if (diff <= 0) expired.push(m.ign);
        else if (diff <= 5) soon.push(`${m.ign} (${diff}d)`);
    });

    let bar = document.getElementById("notificationBar");
    if (!bar) return;

    if (expired.length) {
        bar.className = "notification-bar alert-expired";
        bar.innerHTML = "🔴 EXPIRED: " + expired.join(", ");
    } else if (soon.length) {
        bar.className = "notification-bar alert-soon";
        bar.innerHTML = "🟠 WARNING: " + soon.join(", ");
    } else {
        bar.className = "notification-bar alert-none";
        bar.innerHTML = "🟢 All Active";
    }
}

// 🔔 POPUP
function showPopupReminders() {
    let today = new Date();
    today.setHours(0,0,0,0);

    let expired = [];
    let soon = [];

    membersData.forEach(m => {
        let exp = new Date(m.expiry);
        exp.setHours(0,0,0,0);

        let diff = Math.ceil((exp - today)/(1000*60*60*24));

        if (diff <= 0) expired.push(m.ign);
        else if (diff <= 5) soon.push(`${m.ign} (${diff}d)`);
    });

    let lastShown = localStorage.getItem("lastPopupDate");
    let todayStr = today.toISOString().split("T")[0];

    if (lastShown === todayStr) return;
    if (!expired.length && !soon.length) return;

    let msg = "📢 MEMBERSHIP ALERT\n\n";

    if (expired.length) msg += "🔴 EXPIRED:\n" + expired.join(", ") + "\n\n";
    if (soon.length) msg += "🟠 EXPIRING SOON:\n" + soon.join(", ");

    alert(msg);
    localStorage.setItem("lastPopupDate", todayStr);
}

// 📊 DISPLAY MEMBERS (🔥 FIXED)
function displayMembers() {
    let tb = document.getElementById("tableBody");
    if (!tb) return;

    tb.innerHTML = "";

    let isAdmin = localStorage.getItem('isAdmin') === 'true';

    // 👉 FIX HEADER
    let header = document.getElementById("actionHeader");
    if (header) {
        header.style.display = isAdmin ? "table-cell" : "none";
    }

    membersData.sort((a,b)=> new Date(a.expiry) - new Date(b.expiry));

    if (!membersData.length) {
        tb.innerHTML = "<tr><td colspan='" + (isAdmin ? 4 : 3) + "'>No members</td></tr>";
        return;
    }

    membersData.forEach((m,i)=>{
        let row = tb.insertRow();

        row.insertCell(0).innerHTML = m.ign + "<br><small>("+m.owner+")</small>";
        row.insertCell(1).innerHTML = formatDate(new Date(m.expiry));
        row.insertCell(2).innerHTML = getStatus(m.expiry);

        if (isAdmin) {
            let cell = row.insertCell(3);
            cell.innerHTML =
                `<button class="action-btn" onclick="openModal(${i})">VIEW</button>`;
        }
    });
}

// ➕ ADD MEMBER
function addMember() {
    let ign = document.getElementById("newIGN").value.trim();
    let owner = document.getElementById("newOwner").value.trim();
    let date = document.getElementById("newDate").value;

    if (!ign || !owner || !date) return alert("Fill all fields!");

    let d = new Date(date);
    d.setMonth(d.getMonth() + 1);

    let yyyy = d.getFullYear();
    let mm = String(d.getMonth()+1).padStart(2,'0');
    let dd = String(d.getDate()).padStart(2,'0');

    membersData.push({
        ign, owner,
        expiry: `${yyyy}-${mm}-${dd}`,
        history: [{ date: new Date().toISOString(), action: "📥 Member Added" }]
    });

    localStorage.setItem('botMembers', JSON.stringify(membersData));

    displayMembers();
    checkNotifications();

    newIGN.value = "";
    newOwner.value = "";
    newDate.value = "";
}

// 🔥 MODAL
function openModal(i) {
    selectedIndex = i;
    document.getElementById("modal-ign").innerHTML =
        "IGN: " + membersData[i].ign;

    document.getElementById("myModal").style.display = "block";
}
function closeModal() {
    document.getElementById("myModal").style.display = "none";
}

// 📜 HISTORY
function openHistory() {
    let m = membersData[selectedIndex];
    let list = document.getElementById("historyList");

    list.innerHTML = "";

    m.history.slice().reverse().forEach(h => {
        list.innerHTML += `
        <div class="history-item">
            🗓️ ${formatDateTime(new Date(h.date))}<br>
            ${h.action}
        </div><hr>`;
    });

    document.getElementById("historyModal").style.display = "block";
}
function closeHistory() {
    document.getElementById("historyModal").style.display = "none";
}

// 🔥 EXTEND
function extendSelected(months) {
    let m = membersData[selectedIndex];
    let old = new Date(m.expiry);

    let y = old.getFullYear();
    let mo = old.getMonth() + months;
    let d = old.getDate();

    let newD = new Date(y, mo, d);
    if (newD.getDate() !== d) newD = new Date(y, mo + 1, 0);

    let yyyy = newD.getFullYear();
    let mm = String(newD.getMonth()+1).padStart(2,'0');
    let dd = String(newD.getDate()).padStart(2,'0');

    m.expiry = `${yyyy}-${mm}-${dd}`;

    m.history.push({
        date: new Date().toISOString(),
        action: `📅 Extended ${months} month(s)`
    });

    localStorage.setItem('botMembers', JSON.stringify(membersData));

    displayMembers();
    checkNotifications();
    closeModal();
}

// ❌ DELETE
function deleteSelected() {
    if (confirm("Delete?")) {
        membersData.splice(selectedIndex,1);
        localStorage.setItem('botMembers', JSON.stringify(membersData));
        displayMembers();
        checkNotifications();
        closeModal();
    }
}

// 🔍 SEARCH
function searchMember() {
    let txt = prompt("Enter IGN:");
    if (!txt) return;

    let m = membersData.find(x => x.ign.toLowerCase() === txt.toLowerCase());
    if (m) {
        alert(`IGN: ${m.ign}\nOwner: ${m.owner}\nExpiry: ${formatDate(new Date(m.expiry))}`);
    } else alert("Not found");
}

// 🚀 START
window.onload = function() {
    let isAdmin = localStorage.getItem('isAdmin') === 'true';

    if (isAdmin) showAdminControls();

    displayMembers();
    checkNotifications();
    showPopupReminders();

    document.getElementById("historyModal").onclick = e => {
        if (e.target.id === "historyModal") closeHistory();
    };
    document.getElementById("myModal").onclick = e => {
        if (e.target.id === "myModal") closeModal();
    };
};
</script>
</body>
</html>
